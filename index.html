<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <p class="eyebrow">Stay organized</p>
          <h1>To-Do List</h1>
        </div>
        <button
          type="button"
          id="themeToggle"
          class="theme-toggle"
          aria-label="Switch to dark mode"
        >
          Dark
        </button>
      </header>

      <form id="taskForm" class="task-form">
        <label class="sr-only" for="taskInput">New task</label>
        <input
          id="taskInput"
          type="text"
          maxlength="120"
          placeholder="What do you need to do?"
          autocomplete="off"
        />
        <button type="submit" class="add-btn">Add</button>
      </form>
      <p id="errorMessage" class="error" role="alert" hidden></p>

      <section class="stats" aria-live="polite">
        <div class="stat-card">
          <span class="stat-label">Total tasks</span>
          <strong id="totalCount">0</strong>
        </div>
        <div class="stat-card">
          <span class="stat-label">Completed</span>
          <strong id="completedCount">0</strong>
        </div>
      </section>

      <ul id="taskList" class="task-list"></ul>
      <p id="emptyState" class="empty-state">No tasks yet. Add one above to get started.</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
